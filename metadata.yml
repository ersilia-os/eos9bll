Status: In progress
Title: Macroscopic pKa and Protonation States
Description: Predicts the macroscopic pKa values and pH-dependent protonation 
  state of a small molecule with pKasso, an open-source package from Bind 
  Research. Site-level pKa predictions from two published models, MolGpKa and a 
  retrained Uni-pKa, are adjusted with rule-based corrections, averaged as 
  microstate free energies and combined into populations of every protonation 
  state, from which whole-molecule pKa values and the net charge at a given pH 
  follow. Across six public benchmarks the authors report a mean absolute error 
  of 0.61 pKa units. The input tautomer is kept fixed.
