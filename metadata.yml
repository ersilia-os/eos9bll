Identifier: eos9bll
Slug: pkasso
Status: Ready
Title: Macroscopic pKa and Protonation States
Description: Predicts whole-molecule (macroscopic) pKa values and the 
  pH-dependent net charge of small molecules with pKasso from Bind Research. 
  Site pKa predictions from MolGpKa and a Uni-pKa model retrained with IUPAC 
  data are combined into populations of every protonation state. On six 
  experimental benchmarks this mixed mode, with the single Uni-pKa fold run here
  on CPU, gives a mean absolute error of 0.61 pKa units. Validated only on small
  organic molecules; the input tautomer is kept for all states, and state 
  populations are checked only qualitatively.
